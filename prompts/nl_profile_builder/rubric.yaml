criteria:
  - name: Uses tool shape
    description: The response should map cleanly to roles, seniority, tech_stack, remote_terms, timezone_terms, and exclude_terms, with each distinct title in its own roles entry.
  - name: Correct mapping
    description: The extracted values should match what is stated in the input — roles contain the stated job titles as separate entries, seniority matches the implied level, tech_stack contains the mentioned technologies, remote_terms reflect the stated work arrangement, timezone_terms match the stated timezones, and exclude_terms capture the stated exclusions.
  - name: Avoids invention
    description: The response should not add technologies, locations, visa terms, or constraints absent from the input.
  - name: Search usefulness
    description: Terms should be concise and likely to appear in job postings.
